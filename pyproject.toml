[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-layout"
version = "0.1.0"
description = "2D multi-monitor spatial layout solver from QR photo detections and Deskflow v1.27+ configuration compiler."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
